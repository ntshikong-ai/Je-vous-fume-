A DIFFERENT KIND OF SUCCESS

Daniel had always believed that success meant being the best in everything he did. At school, he compared his grades with those of his classmates and became frustrated whenever someone performed better than him. Even when he achieved good results, he rarely felt satisfied because he was already thinking about the next person he had to beat.

One afternoon, his science teacher asked him to help a younger student who was struggling with a difficult lesson. At first, Daniel considered the task a waste of time. He wanted to use the afternoon to prepare for an important test. However, he eventually agreed.

To his surprise, explaining the lesson made Daniel understand several ideas that he had never completely mastered himself. More importantly, he realized that helping someone improve did not make his own achievements less valuable.

From that day on, Daniel began to see success differently. Competition still mattered to him, but it was no longer the only measure he used to judge his progress.

Over the following weeks, Daniel changed the way he studied. Instead of comparing every mark with those of his classmates, he began comparing his current performance with his previous results. When he made a mistake, he tried to understand its cause rather than simply feeling disappointed.

His teacher noticed the change. Daniel was still ambitious, but his ambition had become healthier. He wanted to improve, not simply to defeat other students. He also discovered that explaining difficult ideas to others was one of the best ways to test his own understanding.

This new attitude did not make Daniel less serious about school. On the contrary, he became more organized. He planned his study sessions, revised regularly and asked questions whenever something was unclear.

After several months, his grades improved. More importantly, he became calmer before examinations. He no longer believed that one bad result meant that he had failed completely.

Daniel finally understood that success could have several meanings. Winning a competition was one possible achievement, but learning from mistakes, helping others and becoming better than before were also forms of success.
`;

APPRENDRE À PROGRESSER

Lorsque Mathieu commença sa préparation aux examens, il croyait que les meilleurs élèves étaient ceux qui ne commettaient presque jamais d'erreurs. Il comparait régulièrement ses résultats à ceux de ses camarades et se sentait découragé lorsqu'il obtenait une note inférieure.

Le professeur lui expliqua alors que l'erreur n'était pas nécessairement le signe d'un manque d'intelligence. Elle pouvait au contraire devenir un outil permettant de comprendre ce qui devait être amélioré.

À partir de ce jour, Mathieu décida de modifier sa méthode de travail. Il commença par conserver ses anciennes évaluations. Pour chaque erreur, il écrivait la cause probable de celle-ci et cherchait une manière de ne plus la reproduire.

Il découvrit rapidement que certaines erreurs provenaient d'un manque de connaissances, tandis que d'autres étaient simplement dues à une lecture trop rapide des consignes. Il apprit donc à prendre quelques secondes supplémentaires pour comprendre exactement ce que chaque question demandait.

Progressivement, ses résultats commencèrent à s'améliorer. Pourtant, le changement le plus important ne concernait pas ses notes. Mathieu était devenu plus patient avec lui-même. Lorsqu'un exercice lui semblait difficile, il ne concluait plus immédiatement qu'il en était incapable.

Il comprit également que la réussite d'un camarade ne diminuait pas la sienne. Au contraire, observer les méthodes des autres pouvait lui permettre de découvrir de nouvelles stratégies.

Quelques semaines avant les examens, Mathieu établit un programme de révision. Il alternait les matières, consacrait davantage de temps aux notions qu'il maîtrisait mal et réservait régulièrement des moments pour refaire les exercices dans lesquels il avait échoué.

Le jour de l'examen, il ressentit naturellement une certaine inquiétude. Cependant, cette inquiétude ne le paralysa pas. Il relut attentivement les consignes, géra son temps et revint sur les questions difficiles lorsque cela était nécessaire.

À la fin de l'épreuve, Mathieu comprit qu'il avait appris quelque chose de plus important qu'une simple méthode pour obtenir une bonne note. Il avait appris que progresser ne signifie pas être parfait. Progresser signifie reconnaître ses faiblesses, apprendre de ses erreurs et continuer à avancer.
`;

];


/* =========================================================
   VERIFICATION
========================================================= */

if(QUESTIONS.length !== 100){
    alert("Erreur : le test doit contenir exactement 100 questions.");
}


/* =========================================================
   MELANGE DES REPONSES
========================================================= */

function shuffleAnswers(){

    QUESTIONS.forEach(question=>{

        const correctText=question.o[question.a];

        for(let i=question.o.length-1;i>0;i--){

            const j=Math.floor(Math.random()*(i+1));

            [question.o[i],question.o[j]]
            =
            [question.o[j],question.o[i]];
        }

        question.a=question.o.indexOf(correctText);

    });

}

shuffleAnswers();


/* =========================================================
   VARIABLES
========================================================= */

const app=document.getElementById("app");

let current=0;

let answers=new Array(100).fill(null);

let questionSeconds=60;

let readingSeconds=900;

let questionTimer=null;

let readingTimer=null;

let totalQuestionTime=0;

let testFinished=false;


/* =========================================================
   UTILITAIRES
========================================================= */

function formatTime(seconds){

    const min=Math.floor(seconds/60);

    const sec=seconds%60;

    return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}


function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function stopTimers(){

    clearInterval(questionTimer);

    clearInterval(readingTimer);

}


/* =========================================================
   ACCUEIL
========================================================= */

function showHome(){

    stopTimers();

    app.innerHTML=`

    <div class="home">

        <div class="watermark">
            NATHAN
        </div>

        <div class="home-content">

            <h2>PRÉPA EXCELLENTIA WANTANSHI</h2>

            <h1>
                TEST BLANC
                <br>
                100 QUESTIONS
            </h1>

            <p>
                Mathématiques • Français • Anglais • Culture générale
            </p>

            <input
                id="candidateName"
                placeholder="Nom complet du participant"
            >

            <br>

            <button
                class="start"
                onclick="startTest()"
            >
                COMMENCER LE TEST
            </button>

            <p>
                1 minute par question
            </p>

            <p>
                Textes anglais et français :
                15 minutes maximum de lecture
            </p>

        </div>

    </div>

    `;

}


/* =========================================================
   DEMARRAGE
========================================================= */

function startTest(){

    const name=
        document.getElementById("candidateName").value.trim();

    if(!name){

        alert("Veuillez entrer le nom complet du participant.");

        return;

    }

    current=0;

    answers.fill(null);

    totalQuestionTime=0;

    testFinished=false;

    startReading("Anglais");

}


/* =========================================================
   LECTURE
========================================================= */

function startReading(language){

    stopTimers();

    readingSeconds=900;

    const text=
        language==="Anglais"
        ?
        TEXT_EN
        :
        TEXT_FR;

    app.innerHTML=`

    <div class="reading">

        <h1>
            ${language}
        </h1>

        <div class="card">

            <h2>
                TEMPS DE LECTURE
            </h2>

            <div
                id="readingTimer"
                class="timer"
            >
                15:00
            </div>

            <p class="reading-info">

                Tu disposes de 15 minutes maximum
                pour lire le texte.

                <br><br>

                <b>
                Tu peux cependant passer aux questions
                immédiatement si tu le souhaites.
                </b>

            </p>

            <button
                class="skip"
                onclick="skipReading()"
            >
                PASSER DIRECTEMENT AUX QUESTIONS →
            </button>

            <hr>

            <div class="reading-text">

                ${escapeHTML(text)}

            </div>

        </div>

    </div>

    `;


    readingTimer=setInterval(()=>{

        readingSeconds--;

        const timer=
            document.getElementById("readingTimer");

        if(timer){

            timer.textContent=
                formatTime(readingSeconds);

        }

        if(readingSeconds<=0){

            stopTimers();

            beginQuestion();

        }

    },1000);

}


/* =========================================================
   PASSER LA LECTURE
========================================================= */

function skipReading(){

    stopTimers();

    beginQuestion();

}


/* =========================================================
   QUESTION
========================================================= */

function beginQuestion(){

    stopTimers();

    questionSeconds=60;

    const question=QUESTIONS[current];

    const percent=
        ((current+1)/100)*100;


    let reviewButton="";

    if(
        question.subject==="Anglais" ||
        question.subject==="Français"
    ){

        reviewButton=`

        <button
            class="review"
            onclick="showTextAgain()"
        >
            👁 JETER UN COUP D'ŒIL AU TEXTE
        </button>

        `;

    }


    app.innerHTML=`

    <div>

        <div class="question-header">

            <div>

                <b>
                    ${question.subject}
                </b>

                <br>

                Question
                ${current+1}
                /100

            </div>

            <div
                id="questionTimer"
                class="question-timer"
            >
                01:00
            </div>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                style="width:${percent}%"
            ></div>

        </div>


        <div class="card">

            <h2>
                ${escapeHTML(question.q)}
            </h2>

            <div class="options">

                ${question.o.map((option,index)=>`

                    <button
                        data-index="${index}"
                        onclick="selectAnswer(${index})"
                    >

                        <b>
                            ${String.fromCharCode(65+index)}.
                        </b>

                        ${escapeHTML(option)}

                    </button>

                `).join("")}

            </div>


            ${reviewButton}


            <br>

            <button
                id="nextButton"
                class="next"
                disabled
                onclick="nextQuestion()"
            >
                ${current===99 ? "TERMINER LE TEST" : "QUESTION SUIVANTE →"}
            </button>

        </div>

    </div>

    `;


    questionTimer=setInterval(()=>{

        questionSeconds--;

        totalQuestionTime++;

        const timer=
            document.getElementById("questionTimer");

        if(timer){

            timer.textContent=
                formatTime(questionSeconds);

        }

        if(questionSeconds<=0){

            nextQuestion();

        }

    },1000);

}


/* =========================================================
   CHOIX REPONSE
========================================================= */

function selectAnswer(index){

    answers[current]=index;

    document
        .querySelectorAll(".options button")
        .forEach(button=>{

            button.classList.remove("selected");

        });


    const selected=
        document.querySelector(
            `.options button[data-index="${index}"]`
        );

    if(selected){

        selected.classList.add("selected");

    }


    document.getElementById("nextButton")
        .disabled=false;

}


/* =========================================================
   QUESTION SUIVANTE
========================================================= */

function nextQuestion(){

    stopTimers();

    if(answers[current]===null){

        if(questionSeconds>0){

            alert(
                "Veuillez choisir une réponse avant de continuer."
            );

            beginQuestion();

            return;

        }

        /*
        Si le temps est terminé et aucune réponse
        n'a été choisie, la question est comptée
        comme non répondue.
        */

    }


    current++;


    if(current>=100){

        finishTest();

        return;

    }


    /*
    Après les 25 questions d'anglais,
    on ouvre la lecture française.
    */

    if(current===25){

        startReading("Français");

        return;

    }


    beginQuestion();

}


/* =========================================================
   REVOIR LE TEXTE
========================================================= */

function showTextAgain(){

    const question=QUESTIONS[current];

    const text=
        question.subject==="Anglais"
        ?
        TEXT_EN
        :
        TEXT_FR;


    const modal=
        document.createElement("div");

    modal.className="modal";


    modal.innerHTML=`

        <div class="modal-content">

            <h2>
                Texte —
                ${question.subject}
            </h2>

            <p>
                ${escapeHTML(text)}
            </p>

            <button
                class="close"
                onclick="this.closest('.modal').remove()"
            >
                FERMER LE TEXTE
            </button>

        </div>

    `;


    document.body.appendChild(modal);

}


/* =========================================================
   RESULTATS
========================================================= */

function finishTest(){

    stopTimers();

    testFinished=true;

    let score=0;

    QUESTIONS.forEach((question,index)=>{

        if(answers[index]===question.a){

            score++;

        }

    });


    const percentage=score;

    const errors=100-score;

    const minutes=
        Math.floor(totalQuestionTime/60);

    const seconds=
        totalQuestionTime%60;


    const name=
        document.getElementById("candidateName")
        ?
        document.getElementById("candidateName").value
        :
        "Participant";


    let errorsHTML="";


    QUESTIONS.forEach((question,index)=>{

        if(answers[index]!==question.a){

            const studentAnswer=
                answers[index]===null
                ?
                "Aucune réponse"
                :
                String.fromCharCode(
                    65+answers[index]
                )+
                ". "+
                question.o[answers[index]];


            const correctAnswer=
                String.fromCharCode(
                    65+question.a
                )+
                ". "+
                question.o[question.a];


            errorsHTML+=`

                <div class="error">

                    <b>
                        Question ${index+1}
                    </b>

                    <p>
                        ${escapeHTML(question.q)}
                    </p>

                    <p class="wrong">

                        Ta réponse :
                        ${escapeHTML(studentAnswer)}

                    </p>

                    <p class="correct">

                        Bonne réponse :
                        ${escapeHTML(correctAnswer)}

                    </p>

                    <p>

                        <b>Explication :</b>
                        ${escapeHTML(question.e)}

                    </p>

                </div>

            `;

        }

    });


    app.innerHTML=`

    <div class="result-card">

        <h1 style="text-align:center">
            RÉSULTATS
        </h1>

        <h2 style="text-align:center">
            ${escapeHTML(name)}
        </h2>

        <div class="score">
            ${percentage}%
        </div>

        <p style="text-align:center;font-size:20px">

            ${score}/100 bonnes réponses

            <br>

            ${errors} erreur(s)

        </p>


        <div class="time-result">

            ⏱️ Temps dépensé pendant les questions :

            <br>

            <b>
                ${minutes} min ${seconds} sec
            </b>

        </div>


        <hr>


        <h2>
            DÉTAIL DES ERREURS
        </h2>


        ${
            errorsHTML ||
            `
            <h2
                class="correct"
                style="text-align:center"
            >
                🎉 Félicitations !
                Aucune erreur.
            </h2>
            `
        }


        <footer>
            Prépa Excellentia Wantanshi
            <br>
            by Nathan
        </footer>

    </div>

    `;

}


/* =========================================================
   ANTI-TRICHE
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.hidden &&
            !testFinished
        ){

            alert(
                "⚠️ TENTATIVE DE TRICHE DÉTECTÉE !\n\n"+
                "Tu as quitté la page du test. "+
                "Le chronomètre continue."
            );

        }

    }
);


window.addEventListener(
    "beforeunload",
    event=>{

        if(!testFinished){

            event.preventDefault();

            event.returnValue="";

        }

    }
);


/* =========================================================
   INTERDICTION DU RETOUR
========================================================= */

history.pushState(
    null,
    "",
    location.href
);

window.addEventListener(
    "popstate",
    ()=>{

        if(!testFinished){

            alert(
                "⚠️ Retour en arrière interdit pendant le test."
            );

            history.pushState(
                null,
                "",
                location.href
            );

        }

    }
);


/* =========================================================
   DEMARRAGE
========================================================= */

showHome();

</script>

</body>
</html>
